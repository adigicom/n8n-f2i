services:
  - type: web
    name: n8n-f2i
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_USER
        value: adigicom
      - key: N8N_PASSWORD
        generateValue: true
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: n8n-f2i
          property: host
